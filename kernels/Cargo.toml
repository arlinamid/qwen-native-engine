[package]
name = "qwen-kernels"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Feasibility prototype: hand-written WebGPU decode kernels at Qwen3.5-0.8B shapes"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
futures-channel = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-time = "1"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "webgpu", "dx12", "vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["unstable_wasm", "fancy-regex"] }
